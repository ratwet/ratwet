name: 🐍 Generate Contribution Snake

on:
  # Refresh automatically every day
  schedule:
    - cron: "0 0 * * *"

  # Allow manual generation from GitHub Actions
  workflow_dispatch:

  # Refresh when the profile README changes
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  generate:
    name: Generate Contribution Snake
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 🐍 Generate animated snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}

          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23D4AF37&color_dots=%231A1F13,%23333D1A,%23556B2F,%238A9A5B,%23D4AF37

            dist/github-contribution-grid-snake-dark.svg?color_snake=%23D4AF37&color_dots=%231A1F13,%23333D1A,%23556B2F,%238A9A5B,%23D4AF37

            dist/github-contribution-grid-snake.gif?color_snake=%23D4AF37&color_dots=%231A1F13,%23333D1A,%23556B2F,%238A9A5B,%23D4AF37&color_background=%231A1F13

      - name: 🚀 Publish generated files
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
